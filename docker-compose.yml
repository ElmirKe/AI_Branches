version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: branching_chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: branching_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # При первом запуске автоматически применятся миграции и сиды:
      - ./migrations/001_initial_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./migrations/002_tree_functions_and_triggers.up.sql:/docker-entrypoint-initdb.d/02_triggers.sql
      - ./seeds/001_seed_pressure_chat.sql:/docker-entrypoint-initdb.d/03_seed.sql

  # Легковесный веб-интерфейс для просмотра БД и выполнения SQL прямо в браузере (http://localhost:8081)
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: branching_chat_pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/branching_chat?sslmode=disable
    depends_on:
      - postgres

volumes:
  pgdata:
